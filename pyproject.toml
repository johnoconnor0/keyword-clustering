[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-clustering"
version = "0.2.1"
description = "Interactive SEO keyword clustering, page mapping, and content-gap analysis tool"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "John O'Connor", email = "john@weblifter.com.au"},
]
keywords = [
    "seo", "keyword-clustering", "keyword-research",
    "content-gap", "page-mapping", "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "nltk>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
# kaleido<1.0 stays self-contained — v1+ requires a system Chrome install which
# bloats Docker images and breaks Streamlit Cloud's headless build environment.
app = ["streamlit>=1.32", "plotly>=5.18", "kaleido>=0.2,<1.0"]
semantic = ["sentence-transformers>=2.6"]
advanced = ["hdbscan>=0.8", "umap-learn>=0.5", "hnswlib>=0.8.0"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "pytest-benchmark>=4.0", "ruff>=0.6.0", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
keyword-cluster = "keyword_clustering.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["keyword_clustering*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "E712"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
# Previous config silenced attr-defined and return-value globally; both have been re-enabled.
# The two narrow `# type: ignore[attr-defined]` annotations in vectorization.py + pipeline.py
# are documented at their use sites (sparse matrices flow through `object` parameters).
# disable_error_code = []
