site_name: SEO Keyword Clustering
site_description: Interactive SEO keyword clustering, page mapping, and content-gap analysis
site_author: John O'Connor
site_url: https://johnoconnor0.github.io/keyword-clustering/

repo_name: johnoconnor0/keyword-clustering
repo_url: https://github.com/johnoconnor0/keyword-clustering

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - CLI Reference: cli.md
  - Output Files: outputs.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
